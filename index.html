<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toon Bar - Fractal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'toon-bg': '#FFF5F5',
              'toon-card': '#FFFFFF',
              'toon-primary': '#FF6B6B', // Coral Red
              'toon-secondary': '#4ECDC4', // Teal
              'toon-accent': '#FFE66D', // Yellow
              'toon-dark': '#292F36', // Black-ish
              'toon-border': '#1A1A1A',
            },
            fontFamily: {
              sans: ['Fredoka', 'sans-serif'],
              display: ['Bangers', 'cursive'],
            },
            boxShadow: {
              'toon': '4px 4px 0px 0px #1A1A1A',
              'toon-hover': '8px 8px 0px 0px #1A1A1A',
              'toon-active': '0px 0px 0px 0px #1A1A1A',
              'toon-sm': '2px 2px 0px 0px #1A1A1A',
            },
            borderWidth: {
              '3': '3px',
            },
            animation: {
              'bounce-slight': 'bounce-slight 2s infinite',
              'pop-in': 'pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
              'expand': 'expand 0.5s ease-in-out forwards',
              'heart-burst': 'heart-burst 0.4s ease-out forwards',
              'confetti': 'confetti 2s ease-out forwards',
            },
            keyframes: {
              'bounce-slight': {
                '0%, 100%': { transform: 'translateY(-3%)' },
                '50%': { transform: 'translateY(0)' },
              },
              'pop-in': {
                '0%': { transform: 'scale(0.8)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' }
              },
              'fade-in-up': {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              },
              'heart-burst': {
                '0%': { transform: 'scale(1)' },
                '50%': { transform: 'scale(1.3)' },
                '100%': { transform: 'scale(1)' }
              },
              'confetti': {
                '0%': { transform: 'translateY(0) rotate(0)', opacity: '1' },
                '100%': { transform: 'translateY(100vh) rotate(720deg)', opacity: '0' }
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(10px);
      }
      
      /* Simple confetti squares */
      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: #ffd300;
        top: -10px;
        z-index: 50;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0"
  }
}
</script>
</head>
<body class="bg-toon-bg text-toon-dark antialiased selection:bg-toon-primary selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
