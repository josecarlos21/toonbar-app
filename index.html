<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toon Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Bangers&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'toon-bg': '#FFF5F5',
              'toon-card': '#FFFFFF',
              'toon-primary': '#FF6B6B', // Coral Red
              'toon-secondary': '#4ECDC4', // Teal
              'toon-accent': '#FFE66D', // Yellow
              'toon-dark': '#292F36', // Black-ish
              'toon-border': '#1A1A1A',
            },
            fontFamily: {
              sans: ['Fredoka', 'sans-serif'],
              display: ['Bangers', 'cursive'],
            },
            boxShadow: {
              'toon': '4px 4px 0px 0px #1A1A1A',
              'toon-hover': '6px 6px 0px 0px #1A1A1A',
              'toon-active': '2px 2px 0px 0px #1A1A1A',
            },
            borderWidth: {
              '3': '3px',
            },
            animation: {
              'bounce-slight': 'bounce-slight 2s infinite',
              'pop-bounce': 'pop-bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
            },
            keyframes: {
              'bounce-slight': {
                '0%, 100%': { transform: 'translateY(-2%)' },
                '50%': { transform: 'translateY(0)' },
              },
              'pop-bounce': {
                '0%': { transform: 'scale(0.8) translateY(10px)', opacity: '0' },
                '100%': { transform: 'scale(1) translateY(0)', opacity: '1' }
              }
            }
          },
        },
      }
    </script>
    <style>
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-toon-bg text-toon-dark antialiased selection:bg-toon-primary selection:text-white">
    <div id="root"></div>
  </body>
</html>
