             { id: 1, title: 'Dry Shake', description: 'Sin hielo primero.', image: 'https://images.unsplash.com/photo-1597075687490-8f673c6c17f6?w=600', bgColor: 'bg-gray-100' }
          ]
        },
        // --- FAMILIA MEXICAN ---
        {
          id: 'michelada',
          family: 'Mexicanas',
          name: 'Michelada',
          description: 'Cerveza preparada con todo.',
          image: 'https://images.unsplash.com/photo-1587223962930-cb7f31384c19?w=800',
          tags: ['Mexicano', 'Cerveza'],
          difficulty: 'Fácil',
          time: '3 min',
          rating: 4.9,
          likes: 2100,
          ingredients: [
            { name: 'Cerveza', amount: '1', icon: 'sports_bar', color: 'bg-yellow-200' },
            { name: 'Salsas', amount: 'Mix', icon: 'science', color: 'bg-black text-white' }
          ],
          steps: [
             { id: 1, title: 'Rim', description: 'Chile y limón.', image: 'https://images.unsplash.com/photo-1536935338788-843bb52d3d08?w=600', bgColor: 'bg-red-200' }
          ]
        },
        {
          id: 'charro-negro',
          family: 'Mexicanas',
          name: 'Charro Negro',
          description: 'Cuba libre a la mexicana.',
          image: 'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=800',
          tags: ['Mexicano', 'Tequila'],
          difficulty: 'Fácil',
          time: '2 min',
          rating: 4.5,
          likes: 1300,
          ingredients: [
            { name: 'Tequila', amount: '60 ml', icon: 'local_drink', color: 'bg-yellow-100' },
            { name: 'Cola', amount: 'Top', icon: 'local_bar', color: 'bg-black text-white' }
          ],
          steps: [
             { id: 1, title: 'Build', description: 'Vaso alto con hielo.', image: 'https://images.unsplash.com/photo-1582260655272-4c22737f5cae?w=600', bgColor: 'bg-yellow-100' }
          ]
        },
        {
          id: 'aperol-spritz',
          family: 'Summer Spritz',
          name: 'Aperol Spritz',
          description: 'Atardecer italiano.',
          image: 'https://images.unsplash.com/photo-1560512823-8db965dfc5d4?w=800',
          tags: ['Aperitivo', 'Vino'],
          difficulty: 'Fácil',
          time: '3 min',
          rating: 4.6,
          likes: 1800,
          ingredients: [
             { name: 'Prosecco', amount: '90 ml', icon: 'celebration', color: 'bg-yellow-100' },
             { name: 'Aperol', amount: '60 ml', icon: 'local_bar', color: 'bg-orange-500 text-white' }
          ],
          steps: [
             { id: 1, title: '3-2-1', description: '3 Prosecco, 2 Aperol, 1 Soda.', image: 'https://images.unsplash.com/photo-1560512823-8db965dfc5d4?w=600', bgColor: 'bg-orange-200' }
          ]
        }
      ];

      // --- COMPONENTS ---

      const Button = ({ children, variant = 'primary', fullWidth = false, className = '', ...props }) => {
        const baseStyle = "font-sans font-bold transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
        
        const variants = {
          primary: "bg-toon-primary text-white border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:shadow-toon-hover hover:-translate-y-1 active:translate-y-0 active:shadow-toon-active",
          secondary: "bg-toon-secondary text-white border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:shadow-toon-hover hover:-translate-y-1 active:translate-y-0 active:shadow-toon-active",
          outline: "bg-white text-toon-dark border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:bg-gray-50 hover:-translate-y-1",
          icon: "bg-white/20 backdrop-blur-md border-2 border-white/50 text-white p-3 rounded-full hover:bg-white/30 hover:scale-110"
        };

        return (
          <button className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`} {...props}>
            {children}
          </button>
        );
      };

      const NavBar = () => {
        const location = useLocation();
        const isActive = (path) => location.pathname === path;

        return (
          <nav className="fixed bottom-6 left-4 right-4 z-50 pointer-events-none">
            <div className="glass-panel text-toon-dark rounded-full p-2 pl-8 pr-8 shadow-2xl flex justify-between items-center border-3 border-toon-border max-w-md mx-auto pointer-events-auto md:pl-12 md:pr-12 md:max-w-lg md:py-3 transition-transform hover:scale-[1.02]">
              <Link to="/" className={`flex flex-col items-center transition-colors group ${isActive('/') ? 'text-toon-primary' : 'text-gray-500 hover:text-toon-dark'}`}>
                <span className="material-icons-round text-2xl md:text-[32px] group-hover:-translate-y-1 transition-transform">home</span>
                <span className="text-[10px] font-bold mt-1 hidden md:block tracking-wide">INICIO</span>
              </Link>
              
              <Link to="/" className="relative -top-8 md:-top-10">
                <div className="bg-toon-primary w-16 h-16 md:w-20 md:h-20 rounded-full border-4 border-toon-bg flex items-center justify-center shadow-toon transform transition-all hover:-translate-y-2 hover:rotate-6 active:scale-90">
                  <span className="material-icons-round text-3xl md:text-4xl text-white">local_bar</span>
                </div>
              </Link>
              
              <button className="flex flex-col items-center text-gray-500 hover:text-toon-primary transition-colors group">
                <span className="material-icons-round text-2xl md:text-[32px] group-hover:-translate-y-1 transition-transform">favorite</span>
                <span className="text-[10px] font-bold mt-1 hidden md:block tracking-wide">FAVS</span>
              </button>
            </div>
          </nav>
        );
      };

      const CocktailCard = ({ cocktail }) => {
        return (
          <Link to={`/recipe/${cocktail.id}`} className="block group w-full h-full">
            <article className="bg-white rounded-2xl border-3 border-toon-border shadow-toon overflow-hidden h-full flex flex-col transition-all duration-300 group-hover:-translate-y-2 group-hover:shadow-toon-hover relative">
              <div className="relative h-48 overflow-hidden bg-gray-100">
                <img 
                  src={cocktail.image} 
                  alt={cocktail.name} 
                  loading="lazy"
                  className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110"
                />
                <div className="absolute top-2 right-2">
                  <div className="bg-white/80 backdrop-blur p-1.5 rounded-full border-2 border-toon-border shadow-sm hover:scale-110 transition-transform">
                    <span className="material-icons-round text-toon-primary text-sm">favorite</span>
                  </div>
                </div>
              </div>
              
              <div className="p-4 flex-1 flex flex-col">
                <h3 className="font-display text-2xl text-toon-dark leading-tight mb-1">{cocktail.name}</h3>
                <div className="flex gap-2 mb-2">
                  {cocktail.tags.slice(0, 2).map(tag => (
                    <span key={tag} className="text-[10px] font-bold uppercase tracking-wider text-gray-500 bg-gray-100 px-2 py-0.5 rounded-md border border-gray-200">
                      {tag}
                    </span>
                  ))}
                </div>
                <div className="flex items-center gap-3 text-xs font-bold text-gray-400 mt-auto">
                  <span className="flex items-center gap-1"><span className="material-icons-round text-sm">schedule</span>{cocktail.time}</span>
                  <span className="flex items-center gap-1 text-toon-accent"><span className="material-icons-round text-sm">star</span>{cocktail.rating}</span>
                </div>
              </div>
            </article>
          </Link>
        );
      };

      const FamilyCard = ({ family, cocktails, isExpanded, onToggle }) => {
        // Generate a composite image or use the first one
        const coverImage = cocktails[0].image;
        const count = cocktails.length;

        return (
          <div className={`mb-6 transition-all duration-500 ease-in-out ${isExpanded ? 'scale-[1.01]' : 'hover:scale-[1.01]'}`}>
            {/* Header / Trigger */}
            <div 
              onClick={onToggle}
              className={`bg-white rounded-3xl border-3 border-toon-border shadow-toon cursor-pointer overflow-hidden relative z-10 transition-shadow duration-300 ${isExpanded ? 'shadow-toon-active translate-y-[4px] translate-x-[4px]' : 'hover:shadow-toon-hover'}`}
            >
              <div className="relative h-40 md:h-48">
                <img src={coverImage} className="w-full h-full object-cover opacity-90 transition-transform duration-700 hover:scale-105" />
                <div className="absolute inset-0 bg-gradient-to-r from-toon-dark/90 to-transparent flex items-center px-6 md:px-10">
                  <div>
                    <h2 className="font-display text-4xl md:text-5xl text-white drop-shadow-md tracking-wide transform transition-transform group-hover:translate-x-2">
                      {family}
                    </h2>
                    <div className="flex items-center gap-2 mt-2">
                       <span className="bg-toon-primary text-white text-xs font-bold px-3 py-1 rounded-full border-2 border-white/20 shadow-sm">
                         {count} Variantes
                       </span>
                       <span className={`material-icons-round text-white text-3xl transition-transform duration-500 ${isExpanded ? 'rotate-180' : ''}`}>
                         expand_more
                       </span>
                    </div>
                  </div>
                </div>
                
                {/* Stack effect visual */}
                <div className="absolute right-4 bottom-4 flex -space-x-3">
                  {cocktails.slice(0, 3).map((c, i) => (
                    <img key={c.id} src={c.image} className={`w-10 h-10 rounded-full border-2 border-white object-cover shadow-md z-${30-i*10}`} />
                  ))}
                  {count > 3 && (
                    <div className="w-10 h-10 rounded-full border-2 border-white bg-toon-dark text-white flex items-center justify-center text-xs font-bold z-0">
                      +{count-3}
                    </div>
                  )}
                </div>
              </div>
            </div>

            {/* Expandable Grid */}
            <div className={`grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-4 transition-all duration-500 ease-in-out overflow-hidden ${isExpanded ? 'max-h-[1000px] opacity-100 scale-100' : 'max-h-0 opacity-0 scale-95'}`}>
              {cocktails.map((c, index) => (
                <div key={c.id} className="animate-fade-in-up" style={{ animationDelay: `${index * 50}ms` }}>
                  <CocktailCard cocktail={c} />
                </div>
              ))}
            </div>
          </div>
        );
      };

      // --- PAGES ---

      const Home = () => {
        const [searchTerm, setSearchTerm] = useState('');
        const [expandedFamily, setExpandedFamily] = useState(null);

        // Group cocktails by family
        const families = useMemo(() => {
          const groups = {};
          COCKTAILS.forEach(c => {
            const fam = c.family || 'Otros';
            // Search filter logic applied here to hide families that don't match
            if (searchTerm === '' || 
                c.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                c.tags.some(t => t.toLowerCase().includes(searchTerm.toLowerCase())) ||
                fam.toLowerCase().includes(searchTerm.toLowerCase())
               ) {
              if (!groups[fam]) groups[fam] = [];
              groups[fam].push(c);
            }
          });
          return groups;
        }, [searchTerm]);

        const handleToggle = (family) => {
          setExpandedFamily(prev => prev === family ? null : family);
        };

        return (
          <div className="pb-24 pt-8 px-4 max-w-7xl mx-auto min-h-screen">
            <header className="mb-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
              <div className="flex items-center gap-4 animate-fade-in-up">
                <div className="w-14 h-14 bg-toon-accent rounded-full border-3 border-toon-border flex items-center justify-center shadow-toon-sm rotate-3 hover:rotate-12 transition-transform">
                  <span className="material-icons-round text-3xl text-toon-dark">local_bar</span>
                </div>
                <div>
                  <h1 className="font-display text-5xl mb-0 text-toon-dark leading-none">Toon Bar</h1>
                  <p className="text-gray-500 font-bold text-sm tracking-wider">FRACTAL EDITION</p>
                </div>
              </div>
              
              <div className="w-full md:w-auto animate-fade-in-up" style={{ animationDelay: '100ms' }}>
                <div className="relative group w-full md:w-80">
                  <input 
                    type="text" 
                    placeholder="Busca tu veneno..." 
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-white border-3 border-toon-border rounded-2xl py-3 pl-12 pr-4 font-bold shadow-toon focus:outline-none focus:shadow-toon-active focus:translate-x-[2px] focus:translate-y-[2px] transition-all placeholder:text-gray-300"
                  />
                  <span className="material-icons-round absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-2xl group-focus-within:text-toon-primary transition-colors">search</span>
                </div>
              </div>
            </header>

            <div className="space-y-2">
              {Object.keys(families).length > 0 ? (
                Object.entries(families).map(([family, cocktails], idx) => (
                  <div key={family} className="animate-fade-in-up" style={{ animationDelay: `${idx * 100}ms` }}>
                    <FamilyCard 
                      family={family} 
                      cocktails={cocktails} 
                      isExpanded={expandedFamily === family || searchTerm !== ''} // Auto expand on search
                      onToggle={() => handleToggle(family)}
                    />
                  </div>
                ))
              ) : (
                <div className="text-center py-20 opacity-50 flex flex-col items-center animate-pop-in">
                  <span className="material-icons-round text-8xl mb-4 text-gray-300">liquor</span>
                  <p className="font-bold text-2xl text-gray-400">¡Se acabó el alcohol!</p>
                  <p className="text-gray-400">No encontramos esa bebida.</p>
                </div>
              )}
            </div>
            
            <div className="h-10"></div>
          </div>
        );
      };

      const Recipe = () => {
        const { id } = useParams();
        const navigate = useNavigate();
        const cocktail = COCKTAILS.find(c => c.id === id);
        const [checkedIngredients, setCheckedIngredients] = useState([]);
        const [isLoaded, setIsLoaded] = useState(false);

        useEffect(() => {
          setIsLoaded(true);
          window.scrollTo(0, 0);
        }, []);

        if (!cocktail) return <div>Coctel no encontrado</div>;

        const toggleIngredient = (name) => {
          setCheckedIngredients(prev => prev.includes(name) ? prev.filter(i => i !== name) : [...prev, name]);
        };

        return (
          <div className={`min-h-screen bg-white pb-24 transition-opacity duration-500 ${isLoaded ? 'opacity-100' : 'opacity-0'}`}>
            <div className="relative h-[45vh] lg:h-[50vh] w-full overflow-hidden">
               <img src={cocktail.image} className="w-full h-full object-cover animate-expand scale-105 origin-center" />
               <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/30"></div>
               
               <div className="absolute top-0 left-0 right-0 p-6 flex justify-between items-start">
                 <Button variant="icon" onClick={() => navigate(-1)}><span className="material-icons-round">arrow_back</span></Button>
                 <Button variant="icon"><span className="material-icons-round">favorite_border</span></Button>
               </div>

               <div className="absolute bottom-0 left-0 right-0 p-6 text-white animate-fade-in-up">
                 <div className="bg-toon-primary/90 backdrop-blur-md inline-block px-3 py-1 rounded-lg border border-white/20 mb-2 text-xs font-bold tracking-widest uppercase shadow-sm">
                   {cocktail.family}
                 </div>
                 <h1 className="font-display text-5xl lg:text-7xl mb-2 drop-shadow-lg">{cocktail.name}</h1>
                 <div className="flex gap-4 text-sm font-bold opacity-90">
                   <span className="flex items-center gap-1 bg-black/30 px-3 py-1 rounded-full backdrop-blur"><span className="material-icons-round text-base">timer</span> {cocktail.time}</span>
                   <span className="flex items-center gap-1 bg-black/30 px-3 py-1 rounded-full backdrop-blur"><span className="material-icons-round text-base">bolt</span> {cocktail.difficulty}</span>
                 </div>
               </div>
            </div>

            <div className="max-w-4xl mx-auto px-6 -mt-8 relative z-10">
              <div className="bg-white rounded-[2rem] border-3 border-toon-border shadow-toon p-6 md:p-10 animate-fade-in-up" style={{ animationDelay: '100ms' }}>
                <p className="text-xl text-gray-600 font-medium leading-relaxed mb-8 border-l-4 border-toon-accent pl-4 italic">
                  "{cocktail.description}"
                </p>

                <h2 className="font-display text-3xl mb-6 flex items-center gap-3">
                  <span className="material-icons-round text-toon-secondary">checklist_rtl</span>
                  Ingredientes
                </h2>
                
                <div className="grid gap-3 md:grid-cols-2">
                  {cocktail.ingredients.map((ing, i) => (
                    <div 
                      key={ing.name} 
                      onClick={() => toggleIngredient(ing.name)}
                      className={`flex items-center p-3 rounded-xl border-2 cursor-pointer transition-all duration-200 select-none ${
                        checkedIngredients.includes(ing.name) 
                          ? 'bg-green-50 border-green-400 opacity-50 scale-[0.98]' 
                          : 'bg-white border-gray-100 hover:border-toon-secondary hover:shadow-md'
                      }`}
                    >
                       <div className={`w-10 h-10 ${ing.color} rounded-full flex items-center justify-center border-2 border-toon-border mr-3`}>
                         <span className="material-icons-round text-toon-dark text-lg">{ing.icon}</span>
                       </div>
                       <div className="flex-1">
                         <div className="font-bold text-toon-dark">{ing.name}</div>
                         <div className="text-xs font-bold text-toon-primary">{ing.amount}</div>
                       </div>
                       <div className={`w-6 h-6 rounded-full border-2 flex items-center justify-center transition-colors ${checkedIngredients.includes(ing.name) ? 'bg-green-500 border-green-500' : 'border-gray-300'}`}>
                         <span className="material-icons-round text-white text-xs opacity-100">check</span>
                       </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="mt-8 mb-20">
                 <Button 
                   fullWidth 
                   variant="primary"
                   className="text-xl py-4 flex items-center justify-center gap-2 shadow-toon animate-bounce-slight"
                   onClick={() => navigate(`/prepare/${id}`)}
                 >
                   <span>MODO PREPARACIÓN</span>
                   <span className="material-icons-round">play_circle</span>
                 </Button>
              </div>
            </div>
          </div>
        );
      };

      const Prepare = () => {
        const { id } = useParams();
        const navigate = useNavigate();
        const cocktail = COCKTAILS.find(c => c.id === id);
        const [currentStep, setCurrentStep] = useState(0);

        if (!cocktail || !cocktail.steps) return <div>Error</div>;

        const step = cocktail.steps[currentStep];
        const isLastStep = currentStep === cocktail.steps.length - 1;

        const nextStep = () => {
          if (isLastStep) navigate('/');
          else setCurrentStep(curr => curr + 1);
        };

        return (
          <div className={`min-h-screen flex flex-col ${step.bgColor} transition-colors duration-700 ease-in-out`}>
            <div className="p-6 flex justify-between items-center z-20">
              <button onClick={() => navigate(-1)} className="w-12 h-12 bg-white rounded-full border-3 border-toon-border shadow-sm hover:scale-110 transition-transform flex items-center justify-center">
                <span className="material-icons-round text-toon-dark">close</span>
              </button>
              <div className="font-display text-2xl text-toon-dark">{cocktail.name}</div>
              <div className="w-12 h-12 bg-toon-dark text-white rounded-full border-3 border-white shadow-sm flex items-center justify-center font-bold">
                {currentStep + 1}/{cocktail.steps.length}
              </div>
            </div>

            <div className="flex-1 flex flex-col items-center justify-center px-6 relative overflow-hidden">
               {/* Animated Background Elements */}
               <div className="absolute top-1/4 left-10 w-20 h-20 bg-white opacity-20 rounded-full animate-bounce-slight" style={{ animationDuration: '3s' }}></div>
               <div className="absolute bottom-1/3 right-10 w-32 h-32 bg-white opacity-20 rounded-full animate-bounce-slight" style={{ animationDuration: '4s' }}></div>

               <div key={currentStep} className="w-full max-w-sm animate-pop-in relative z-10">
                 <div className="aspect-square bg-white rounded-[2.5rem] border-4 border-toon-border shadow-toon p-3 rotate-2 mb-8">
                   <img src={step.image} className="w-full h-full object-cover rounded-[2rem] border-2 border-gray-100" />
                 </div>
                 
                 <div className="text-center">
                   <h2 className="font-display text-5xl mb-4 text-toon-dark drop-shadow-sm">{step.title}</h2>
                   <div className="bg-white/80 backdrop-blur-sm p-6 rounded-2xl border-3 border-toon-border shadow-sm inline-block">
                     <p className="text-xl font-bold text-gray-800">{step.description}</p>
                   </div>
                 </div>
               </div>
            </div>

            <div className="p-6 pb-10">
               <div className="max-w-md mx-auto flex gap-4">
                 <Button variant="outline" onClick={() => setCurrentStep(c => Math.max(0, c - 1))} disabled={currentStep === 0} className="flex-1">ATRÁS</Button>
                 <Button variant="primary" onClick={nextStep} className="flex-[2] text-lg">{isLastStep ? '¡LISTO!' : 'SIGUIENTE'}</Button>
               </div>
            </div>
          </div>
        );
      };

      const App = () => {
        return (
          <HashRouter>
            <Routes>
              <Route path="/" element={<><Home /><NavBar /></>} />
              <Route path="/recipe/:id" element={<Recipe />} />
              <Route path="/prepare/:id" element={<Prepare />} />
            </Routes>
          </HashRouter>
        );
      };

      const root = createRoot(document.getElementById('root'));
      root.render(<App />);

    </script>
</body>
</html>
