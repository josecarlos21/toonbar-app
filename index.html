              image: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-orange-200'
            },
            {
              id: 3,
              title: 'Hielo Picado',
              description: 'Cuela en un vaso Tiki o bajo lleno de hielo picado fresco.',
              image: 'https://images.unsplash.com/photo-1536935338788-846bb9981813?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-yellow-100'
            },
            {
              id: 4,
              title: 'Isla Tropical',
              description: 'Decora con una rama grande de menta y media lima vacía invertida (la isla).',
              image: 'https://images.unsplash.com/photo-1550989460-0adf9ea622e2?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-green-100'
            }
          ]
        },
        {
          id: 'tom-collins',
          name: 'Tom Collins',
          description: 'Como una limonada, pero mejor. Ginebra y cítricos en un vaso alto. Refrescante hasta la última gota.',
          image: 'https://images.unsplash.com/photo-1587888637140-849b13f3e1a3?w=800',
          tags: ['Clásico', 'Refrescante', 'Gin'],
          difficulty: 'Fácil',
          time: '3 min',
          rating: 4.5,
          likes: 1250,
          pairing: {
            name: 'Ensalada Mediterránea',
            description: 'Sabores ligeros y frescos que no compiten con la bebida.',
            image: 'https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=600&q=80'
          },
          ingredients: [
            { name: 'Gin', amount: '60 ml', icon: 'local_drink', color: 'bg-blue-50' },
            { name: 'Jugo Limón', amount: '30 ml', icon: 'eco', color: 'bg-yellow-100' },
            { name: 'Jarabe Simple', amount: '15 ml', icon: 'water_drop', color: 'bg-gray-100' },
            { name: 'Agua Mineral', amount: 'Top', icon: 'bubble_chart', color: 'bg-blue-100' },
            { name: 'Cereza', amount: '1 u', icon: 'circle', color: 'bg-red-500 text-white' }
          ],
          steps: [
            {
              id: 1,
              title: 'Vaso Alto',
              description: 'Llena un vaso Collins o alto con cubos de hielo hasta el borde.',
              image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-blue-50'
            },
            {
              id: 2,
              title: 'Construir',
              description: 'Vierte la ginebra, el jugo de limón y el jarabe directamente en el vaso.',
              image: 'https://images.unsplash.com/photo-1587888637140-849b13f3e1a3?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-yellow-50'
            },
            {
              id: 3,
              title: 'Burbujas',
              description: 'Completa con agua mineral con gas. Deja espacio para decorar.',
              image: 'https://images.unsplash.com/photo-1560526860-f33503c35b54?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-blue-100'
            },
            {
              id: 4,
              title: 'Remover',
              description: 'Remueve suavemente una vez para mezclar y decora con limón y cereza.',
              image: 'https://images.unsplash.com/photo-1550989460-0adf9ea622e2?auto=format&fit=crop&w=600&q=80',
              bgColor: 'bg-yellow-100'
            }
          ]
        }
      ];

      // --- COMPONENTS ---

      // Button.tsx
      const Button = ({ 
        children, 
        variant = 'primary', 
        fullWidth = false, 
        className = '',
        ...props 
      }) => {
        const baseStyle = "font-sans font-bold transition-all duration-200 active:translate-x-[2px] active:translate-y-[2px] active:shadow-toon-active disabled:opacity-50 disabled:cursor-not-allowed";
        
        const variants = {
          primary: "bg-toon-primary text-white border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:shadow-toon-hover",
          secondary: "bg-toon-secondary text-white border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:shadow-toon-hover",
          outline: "bg-white text-toon-dark border-3 border-toon-border shadow-toon rounded-xl py-3 px-6 hover:bg-gray-50",
          icon: "bg-white/20 backdrop-blur-md border-2 border-white/50 text-white p-3 rounded-full hover:bg-white/30"
        };

        return (
          <button 
            className={`${baseStyle} ${variants[variant]} ${fullWidth ? 'w-full' : ''} ${className}`}
            {...props}
          >
            {children}
          </button>
        );
      };

      // NavBar.tsx
      const NavBar = () => {
        const location = useLocation();
        const isActive = (path) => location.pathname === path;

        return (
          <nav className="fixed bottom-6 left-4 right-4 z-50 pointer-events-none">
            <div className="bg-toon-dark text-white rounded-full p-2 pl-8 pr-8 shadow-2xl flex justify-between items-center border-2 border-white/10 max-w-md mx-auto pointer-events-auto md:pl-12 md:pr-12 md:max-w-lg md:py-3">
              <Link to="/" className={`flex flex-col items-center transition-colors group ${isActive('/') ? 'text-toon-primary' : 'text-gray-400 hover:text-white'}`}>
                <span className="material-icons-round text-2xl md:text-[32px] group-hover:-translate-y-1 transition-transform">home</span>
                <span className="text-[10px] font-bold mt-1 hidden md:block tracking-wide">INICIO</span>
              </Link>
              
              <Link to="/" className="relative -top-8 md:-top-10">
                <div className="bg-toon-primary w-16 h-16 md:w-20 md:h-20 rounded-full border-4 border-toon-bg flex items-center justify-center shadow-toon transform transition-transform hover:-translate-y-1 hover:scale-105 hover:rotate-3">
                  <span className="material-icons-round text-3xl md:text-4xl text-white">local_bar</span>
                </div>
              </Link>
              
              <button className="flex flex-col items-center text-gray-400 hover:text-white transition-colors group">
                <span className="material-icons-round text-2xl md:text-[32px] group-hover:-translate-y-1 transition-transform">favorite</span>
                <span className="text-[10px] font-bold mt-1 hidden md:block tracking-wide">FAVORITOS</span>
              </button>
            </div>
          </nav>
        );
      };

      // CocktailCard.tsx
      const CocktailCard = ({ cocktail }) => {
        return (
          <Link to={`/recipe/${cocktail.id}`} className="block group w-full max-w-[400px]">
            <article className="bg-white rounded-3xl border-3 border-toon-border shadow-toon overflow-hidden h-full flex flex-col transition-all duration-300 group-hover:-translate-y-2 group-hover:scale-[1.02] group-hover:shadow-toon-hover">
              <div className="relative h-64 overflow-hidden bg-gray-100">
                <img 
                  src={cocktail.image} 
                  alt={cocktail.name} 
                  className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
                />
                <div className="absolute top-4 right-4">
                  <button className="bg-white p-2 rounded-full border-2 border-toon-border shadow-sm hover:bg-red-50 transition-colors">
                    <span className="material-icons-round text-toon-primary text-xl">favorite</span>
                  </button>
                </div>
                <div className="absolute bottom-0 left-0 w-full p-4 bg-gradient-to-t from-black/60 to-transparent">
                </div>
              </div>
              
              <div className="p-5 flex-1 flex flex-col">
                <div className="flex flex-wrap gap-2 mb-3">
                  {cocktail.tags.map(tag => (
                    <span key={tag} className="px-3 py-1 bg-toon-accent/20 text-toon-dark text-xs font-bold rounded-full uppercase tracking-wider border border-toon-accent">
                      {tag}
                    </span>
                  ))}
                </div>
                
                <div className="flex justify-between items-start mb-2">
                  <h3 className="font-display text-3xl text-toon-dark">{cocktail.name}</h3>
                </div>
                
                <div className="flex items-center gap-4 text-sm font-semibold text-gray-500 mt-auto">
                  <div className="flex items-center gap-1">
                    <span className="material-icons-round text-base">schedule</span>
                    {cocktail.time}
                  </div>
                  <div className="flex items-center gap-1">
                    <span className="material-icons-round text-base">bolt</span>
                    {cocktail.difficulty}
                  </div>
                  <div className="flex items-center gap-1 ml-auto text-toon-primary">
                    <span className="material-icons-round text-base">star</span>
                    {cocktail.rating}
                  </div>
                </div>
              </div>
            </article>
          </Link>
        );
      };

      // --- PAGES ---

      // Home.tsx
      const Home = () => {
        const [searchTerm, setSearchTerm] = useState('');
        const [activeCategory, setActiveCategory] = useState('Todos');

        const categories = ['Todos', 'Populares', 'Mexicano', 'Clásico', 'Verano', 'Tequila', 'Vodka'];

        const filteredCocktails = useMemo(() => {
          return COCKTAILS.filter(cocktail => {
            const matchesSearch = cocktail.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                                  cocktail.tags.some(tag => tag.toLowerCase().includes(searchTerm.toLowerCase()));
            
            const matchesCategory = activeCategory === 'Todos' || 
                                    cocktail.tags.map(t => t.toUpperCase()).includes(activeCategory.toUpperCase()) ||
                                    (activeCategory === 'Populares' && cocktail.likes > 1000);

            return matchesSearch && matchesCategory;
          });
        }, [searchTerm, activeCategory]);

        return (
          <div className="pb-24 pt-8 px-4 max-w-7xl mx-auto">
            <header className="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
              <div className="flex items-center gap-4">
                <button className="hidden md:flex items-center justify-center w-12 h-12 rounded-full border-2 border-toon-border hover:bg-white transition-colors">
                  <span className="material-icons-round text-3xl text-toon-dark">menu</span>
                </button>
                <div>
                  <h1 className="font-display text-4xl mb-1 text-center md:text-left">Toon Bar</h1>
                  <p className="text-gray-500 font-medium md:hidden">¿Qué mezclamos hoy?</p>
                </div>
              </div>
              
              <div className="flex flex-col md:flex-row items-center gap-4 w-full md:w-auto">
                <div className="relative group w-full md:w-96 order-2 md:order-1">
                  <input 
                    type="text" 
                    placeholder="Buscar cócteles..." 
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    className="w-full bg-white border-3 border-toon-border rounded-2xl py-3 pl-10 pr-4 font-bold shadow-toon focus:outline-none focus:translate-x-[2px] focus:translate-y-[2px] focus:shadow-toon-active transition-all placeholder:text-gray-400"
                  />
                  <span className="material-icons-round absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xl group-focus-within:text-toon-primary transition-colors">search</span>
                </div>

                <div className="w-12 h-12 bg-toon-secondary rounded-full border-3 border-toon-border overflow-hidden order-1 md:order-2 self-end md:self-auto">
                  <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Profile" className="w-full h-full" />
                </div>
              </div>
            </header>

            <div className="flex gap-4 overflow-x-auto pb-6 no-scrollbar mb-4">
              {categories.map((cat) => (
                <button 
                  key={cat}
                  onClick={() => setActiveCategory(cat)}
                  className={`whitespace-nowrap px-6 py-2 rounded-xl font-bold border-3 border-toon-border shadow-toon transition-all active:scale-95 ${activeCategory === cat ? 'bg-toon-primary text-white shadow-toon-active translate-y-[2px] translate-x-[2px]' : 'bg-white text-toon-dark hover:bg-gray-50'}`}
                >
                  {cat}
                </button>
              ))}
            </div>

            {filteredCocktails.length > 0 ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {filteredCocktails.map(cocktail => (
                  <div key={cocktail.id} className="flex justify-center">
                    <CocktailCard cocktail={cocktail} />
                  </div>
                ))}
              </div>
            ) : (
              <div className="text-center py-20 opacity-50">
                <span className="material-icons-round text-6xl mb-4">sentiment_dissatisfied</span>
                <p className="font-bold text-xl">No encontramos esa bebida...</p>
              </div>
            )}
          </div>
        );
      };

      // Recipe.tsx
      const Recipe = () => {
        const { id } = useParams();
        const navigate = useNavigate();
        const cocktail = COCKTAILS.find(c => c.id === id);
        const [checkedIngredients, setCheckedIngredients] = useState([]);

        if (!cocktail) return <div>Coctel no encontrado</div>;

        const toggleIngredient = (name) => {
          setCheckedIngredients(prev => 
            prev.includes(name) ? prev.filter(i => i !== name) : [...prev, name]
          );
        };

        const handleShare = () => {
          alert('¡Cóctel compartido!');
        };

        return (
          <div className="min-h-screen bg-white pb-24 md:pb-32">
            <div className="md:flex md:items-start md:min-h-[60vh] max-w-7xl mx-auto">
              <div className="relative h-[50vh] w-full md:h-[600px] md:w-2/5 md:sticky md:top-0">
                <img src={cocktail.image} alt={cocktail.name} className="w-full h-full object-cover md:rounded-br-[3rem]" />
                <div className="absolute inset-0 bg-gradient-to-b from-black/30 via-transparent to-white md:hidden"></div>
                
                <div className="absolute top-6 left-4 right-4 flex justify-between items-start z-10">
                  <Button variant="icon" onClick={() => navigate(-1)}>
                    <span className="material-icons-round">arrow_back</span>
                  </Button>
                  <div className="flex gap-3">
                    <Button variant="icon" onClick={handleShare}>
                      <span className="material-icons-round">share</span>
                    </Button>
                    <Button variant="icon">
                      <span className="material-icons-round">bookmark_border</span>
                    </Button>
                  </div>
                </div>

                <div className="absolute -bottom-16 left-4 right-4 md:hidden">
                  <div className="bg-toon-accent border-3 border-toon-border rounded-3xl p-6 shadow-toon text-center transform -rotate-1">
                    <h1 className="font-display text-4xl text-toon-dark mb-1">{cocktail.name}</h1>
                    <div className="flex justify-center gap-4 text-sm font-bold opacity-80">
                      <span className="flex items-center gap-1"><span className="material-icons-round text-base">timer</span> {cocktail.time}</span>
                      <span>•</span>
                      <span className="flex items-center gap-1"><span className="material-icons-round text-base">bolt</span> {cocktail.difficulty}</span>
                    </div>
                  </div>
                </div>
              </div>

              <div className="mt-20 px-6 max-w-lg mx-auto md:mt-0 md:w-3/5 md:px-12 md:max-w-none md:py-12">
                <div className="hidden md:block mb-8">
                  <h1 className="font-display text-6xl text-toon-dark mb-4">{cocktail.name}</h1>
                  <div className="flex gap-6 text-lg font-bold text-gray-500">
                    <span className="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full"><span className="material-icons-round">timer</span> {cocktail.time}</span>
                    <span className="flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-full"><span className="material-icons-round">bolt</span> {cocktail.difficulty}</span>
                    <span className="flex items-center gap-2 bg-toon-primary/10 text-toon-primary px-4 py-2 rounded-full"><span className="material-icons-round">star</span> {cocktail.rating}</span>
                  </div>
                </div>

                <p className="text-gray-600 text-center md:text-left mb-8 font-medium leading-relaxed text-lg">
                  {cocktail.description}
                </p>

                <div className="mb-10">
                  <h2 className="font-display text-3xl mb-6 flex items-center gap-3">
                    <span className="bg-toon-secondary w-10 h-10 rounded-xl border-3 border-toon-border flex items-center justify-center text-white shadow-[3px_3px_0_#000]">
                      <span className="material-icons-round">shopping_basket</span>
                    </span>
                    Ingredientes
                  </h2>
                  <div className="space-y-3">
                    {cocktail.ingredients.map(ing => (
                      <div 
                        key={ing.name} 
                        onClick={() => toggleIngredient(ing.name)}
                        className={`flex items-center p-4 rounded-2xl border-3 cursor-pointer transition-all duration-200 ${
                          checkedIngredients.includes(ing.name) 
                            ? 'bg-green-50 border-green-500 opacity-60' 
                            : 'bg-white border-gray-200 hover:border-toon-border hover:shadow-toon hover:-translate-y-1'
                        }`}
                      >
                        <div className={`w-12 h-12 ${ing.color} rounded-full flex items-center justify-center mr-4 border-2 border-toon-border`}>
                          <span className="material-icons-round text-toon-dark">{ing.icon}</span>
                        </div>
                        <div className="flex-1">
                          <p className="font-bold text-lg text-toon-dark">{ing.name}</p>
                        </div>
                        <div className="font-bold text-toon-secondary bg-toon-secondary/10 px-3 py-1 rounded-lg">
                          {ing.amount}
                        </div>
                        <div className={`ml-4 w-6 h-6 rounded-full border-2 border-toon-border flex items-center justify-center transition-colors ${checkedIngredients.includes(ing.name) ? 'bg-green-500' : 'bg-white'}`}>
                          {checkedIngredients.includes(ing.name) && <span className="material-icons-round text-white text-sm">check</span>}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="px-6 md:px-12 max-w-7xl mx-auto">
              {cocktail.pairing && (
                <div className="mb-10">
                  <h2 className="font-display text-3xl mb-6 flex items-center gap-3">
                    <span className="bg-toon-primary w-10 h-10 rounded-xl border-3 border-toon-border flex items-center justify-center text-white shadow-[3px_3px_0_#000]">
                      <span className="material-icons-round">restaurant</span>
                    </span>
                    Maridaje Perfecto (Guak!)
                  </h2>
                  <div className="bg-white rounded-3xl border-3 border-toon-border shadow-toon overflow-hidden group md:flex">
                    <div className="relative h-48 md:h-64 md:w-1/2 overflow-hidden">
                      <img 
                        src={cocktail.pairing.image} 
                        alt={cocktail.pairing.name}
                        className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" 
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                      <div className="absolute bottom-4 left-4">
                        <h3 className="font-display text-3xl text-white tracking-wide drop-shadow-md">{cocktail.pairing.name}</h3>
                      </div>
                    </div>
                    <div className="p-6 bg-yellow-50 md:w-1/2 flex items-center">
                      <p className="font-bold text-gray-700 text-lg leading-relaxed">{cocktail.pairing.description}</p>
                    </div>
                  </div>
                </div>
              )}

              <div className="sticky bottom-6 md:static md:mt-12 md:mb-12">
                <Button 
                  fullWidth 
                  onClick={() => navigate(`/prepare/${id}`)}
                  className="flex items-center justify-center gap-3 text-xl py-4 md:max-w-md md:mx-auto md:hover:scale-105"
                >
                  <span>COMENZAR PREPARACIÓN</span>
                  <span className="material-icons-round text-2xl">play_arrow</span>
                </Button>
              </div>
            </div>
          </div>
        );
      };

      // Prepare.tsx
      const Prepare = () => {
        const { id } = useParams();
        const navigate = useNavigate();
        const cocktail = COCKTAILS.find(c => c.id === id);
        const [currentStep, setCurrentStep] = useState(0);

        if (!cocktail || !cocktail.steps) return <div>Error</div>;

        const step = cocktail.steps[currentStep];
        const isLastStep = currentStep === cocktail.steps.length - 1;

        const nextStep = () => {
          if (isLastStep) {
            navigate('/');
          } else {
            setCurrentStep(curr => curr + 1);
          }
        };

        const prevStep = () => {
          if (currentStep > 0) setCurrentStep(curr => curr - 1);
        };

        return (
          <div className={`min-h-screen flex flex-col ${step.bgColor} transition-colors duration-500`}>
            <div className="p-6 flex justify-between items-center">
              <button onClick={() => navigate(-1)} className="w-10 h-10 bg-white/20 backdrop-blur rounded-full flex items-center justify-center hover:bg-white/40 transition-colors">
                <span className="material-icons-round text-toon-dark">close</span>
              </button>
              <div className="font-display text-xl text-toon-dark uppercase tracking-widest">
                {cocktail.name}
              </div>
              <div className="w-10 h-10 flex items-center justify-center font-bold bg-white rounded-full border-2 border-toon-border shadow-sm">
                {currentStep + 1}/{cocktail.steps.length}
              </div>
            </div>

            <div className="flex-1 flex flex-col items-center justify-center px-6 pb-24 max-w-md mx-auto w-full text-center">
              
              <div className="relative w-full aspect-square mb-8 group">
                <div className="absolute inset-0 bg-white rounded-[3rem] border-4 border-toon-border transform rotate-3 transition-transform group-hover:rotate-6"></div>
                <div className="absolute inset-0 bg-toon-dark rounded-[3rem] border-4 border-toon-border transform -rotate-2 opacity-10"></div>
                <div className="relative w-full h-full rounded-[3rem] border-4 border-toon-border overflow-hidden shadow-toon bg-white">
                  <img 
                    src={step.image} 
                    alt={step.title} 
                    className="w-full h-full object-cover animate-bounce-slight"
                  />
                </div>
                
                <div className="absolute -bottom-6 -right-4 bg-toon-primary text-white font-display text-2xl px-6 py-2 rounded-full border-3 border-toon-border shadow-toon transform -rotate-12">
                  {step.title}
                </div>
              </div>

              <h2 
                key={currentStep}
                className="font-display text-4xl mb-4 text-toon-dark drop-shadow-sm mt-4 uppercase animate-pop-bounce"
              >
                {step.title}
              </h2>
              
              <p className="text-lg font-bold text-gray-700 bg-white/60 backdrop-blur-sm p-4 rounded-2xl border-2 border-white/50">
                {step.description}
              </p>

            </div>

            <div className="fixed bottom-0 left-0 right-0 p-6 bg-white border-t-3 border-toon-border rounded-t-[2.5rem] shadow-[0_-4px_20px_rgba(0,0,0,0.1)]">
              <div className="flex gap-4 max-w-md mx-auto">
                <Button 
                  variant="outline" 
                  onClick={prevStep} 
                  disabled={currentStep === 0}
                  className="flex-1"
                >
                  ATRÁS
                </Button>
                <Button 
                  variant="primary" 
                  onClick={nextStep} 
                  className="flex-[2] flex items-center justify-center gap-2"
                >
                  <span>{isLastStep ? '¡TERMINAR!' : 'SIGUIENTE'}</span>
                  <span className="material-icons-round">{isLastStep ? 'celebration' : 'arrow_forward'}</span>
                </Button>
              </div>
            </div>
          </div>
        );
      };

      // --- APP ---

      const App = () => {
        return (
          <HashRouter>
            <Routes>
              <Route path="/" element={
                <>
                  <Home />
                  <NavBar />
                </>
              } />
              <Route path="/recipe/:id" element={<Recipe />} />
              <Route path="/prepare/:id" element={<Prepare />} />
            </Routes>
          </HashRouter>
        );
      };

      // --- RENDER ---
      const root = createRoot(document.getElementById('root'));
      root.render(<App />);

    </script>
</body>
</html>
